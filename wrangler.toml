name = "jelajah"
main = "server/index.ts"
compatibility_date = "2026-08-01"

# The built SPA. Non-/api requests are served directly from these assets;
# unknown paths fall back to index.html (client-side routing).
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "jelajah-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"   # from the D1 dashboard, or: wrangler d1 create jelajah-db

# File storage: Workers KV — free, no credit card, 1 GB (≈700 PDFs).
[[kv_namespaces]]
binding = "FILES"
id = "REPLACE_WITH_YOUR_KV_ID"            # from the KV dashboard, or: wrangler kv namespace create FILES

# If you ever outgrow KV, replace the kv_namespaces block with this R2 block
# (requires a card on file with Cloudflare; 10 GB free). The app auto-detects
# which one is bound — no code change needed:
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "jelajah-files"

[vars]
# Change this to any long random string before deploying (cookie signing secret)
SESSION_SECRET = "change-me-to-a-long-random-string"
