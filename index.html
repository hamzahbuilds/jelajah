<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2557E8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Jelajah: plan group trips, map every stop, split costs</title>
    <meta name="description" content="Turn an idea, a video or a blog post into a day-by-day trip plan. Invite the group, keep bookings together, get transit times and split costs. Free." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jelajah: the whole trip, planned in one place" />
    <meta property="og:description" content="Plan group trips from a sentence or a link, map every stop with transit times, and split costs. Free." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      try { var p = localStorage.getItem('jl-theme') || '';
        document.documentElement.dataset.theme =
          p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : '') : p;
        if (localStorage.getItem('jl-side') === 'min') document.documentElement.classList.add('side-min');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
